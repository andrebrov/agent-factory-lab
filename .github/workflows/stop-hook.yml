name: Stop Hook regression
on:
  pull_request:
    paths:
      - '.github/workflows/stop-hook.yml'
      - 'experiments/10_stop_hook/**'
      - 'tests/test_stop_hook.py'
      - 'run_all.sh'
      - 'experiments/sample_codebase/**'
      - 'requirements.txt'
      - 'REPORT.md'
      - 'docs/index.html'
      - 'docs/llms-full.txt'
      - 'findings/10_stop_hook.md'
  push:
    branches: [main, fix/experiment10-stop-hook-controls]
    paths:
      - '.github/workflows/stop-hook.yml'
      - 'experiments/10_stop_hook/**'
      - 'tests/test_stop_hook.py'
      - 'run_all.sh'
      - 'experiments/sample_codebase/**'
      - 'requirements.txt'
      - 'REPORT.md'
      - 'docs/index.html'
      - 'docs/llms-full.txt'
      - 'findings/10_stop_hook.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_stop_hook.py
